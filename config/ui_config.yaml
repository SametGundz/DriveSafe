# UI Configuration for Driver Drowsiness Detection Application

window:
  title: 'Sürücü Uykululuk Tespiti'
  width: 1400
  height: 900
  min_width: 1000
  min_height: 700
  start_maximized: true  # Uygulama tam ekran başlatılsın mı?

video_frame:
  width: 800
  height: 600

layout:
  margin: 10
  padding: 5
  spacing: 10
  dock_width: 400  # Metrikler için genişlik (video panel de aynı genişliği kullanacak)

fonts:
  family: 'Arial'
  title_size: 14
  label_size: 12
  value_size: 16

controls:
  button_width: 120
  button_height: 40

# Panel başlıkları için görünüm ayarları
panel_headers:
  background_color: "#f0f0f0"
  text_color: "#333333"
  font_size: 14
  font_weight: "bold"
  border_color: "#e1e1e1"
  padding: 5

indicators:
  label_width: 120
  progress_bar_height: 20
  ear:
    min: 0.0
    max: 1.0
    warning_threshold: 0.25
    critical_threshold: 0.21
    normal_color: "#34c759"  # Apple green
  mar:
    min: 0.0
    max: 1.0
    warning_threshold: 0.7
    critical_threshold: 0.8
    normal_color: "#34c759"  # Apple green
  perclos:
    min: 0.0
    max: 100.0
    warning_threshold: 15.0
    critical_threshold: 20.0
    normal_color: "#34c759"  # Apple green

chart:
  history_duration: 30
  line_width: 2
  y_range_ear: [0.0, 1.0]
  y_range_mar: [0.0, 1.0]
  y_range_perclos: [0.0, 100.0]

camera:
  device: 0
  width: 640
  height: 480
  fps: 30 